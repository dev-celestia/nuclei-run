[package]
name = "nuclei-run"
version = "0.1.0"
edition = "2021"
description = "High-performance Nuclei-compatible vulnerability scanner"
license = "MIT"
readme = "readme.md"
repository = "https://github.com/dev-celestia/nuclei-run"
homepage = "https://github.com/dev-celestia/nuclei-run"
keywords = ["nuclei", "security", "scanner", "vulnerability", "templates"]
categories = ["command-line-utilities", "development-tools::profiling"]

[[bin]]
name = "nuclei-run"
path = "src/main.rs"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "gzip", "json", "socks"] }
governor = "0.8"
nonzero_ext = "0.3"

# Serialization & Template Parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"

# Fast Pattern Matching
aho-corasick = "1.1"
regex = "1.10"

# CLI & Output Formatting
clap = { version = "4", features = ["derive"] }
colored = "2"
url = "2"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# DSL & Crypto Helpers
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
murmur3 = "0.5"
crc32fast = "1.4"
flate2 = "1.0"
hex = "0.4"
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"

# DNS Protocol
hickory-resolver = "0.24"
hickory-proto = "0.24"

# TLS & SSL Inspection
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26"
rustls-pki-types = "1.0"
x509-parser = "0.16"

# XML / XPath Processing
sxd-document = "0.3"
sxd-xpath = "0.4"

# Concurrency
async-channel = "2"
async-trait = "0.1"

# WebSockets & Streams
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Cryptographic Signatures & OOB Decryption
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rsa = { version = "0.9", features = ["sha2"] }

# JavaScript protocol runtime
boa_engine = "0.21"

# Headless browser protocol runtime
chromiumoxide = "0.9"

# Misc
thiserror = "2"
zip = { version = "8.6.0", features = ["deflate"] }
tempfile = "3.27.0"
psl = "2.1.226"
jaq-parse = "1.0.3"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.3"
jaq-core = "3.1.1"
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
